<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMIRY | OMID AMIRY</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="topbar">
    <div class="brand">AMIRY</div>
    <button id="adminBtn" class="admin-btn">⚙️ مدیریت / ویرایش</button>
  </div>
  <div class="hero-content">
    <p class="eyebrow">OMID AMIRY • MASTER BARBER</p>
    <h1 id="siteTitle">AMIRY</h1>
    <p id="siteDescription">۱۰۰ استایل با قیمت‌های ۵۰۰ تا ۳۰۰۰ افغانی</p>
  </div>
</header>

<main>
<section class="toolbar">
  <input id="search" type="search" placeholder="جستجوی استایل یا شماره...">
  <select id="categoryFilter"></select>
</section>
<section id="products" class="products"></section>
</main>

<div id="editor" class="modal hidden">
 <div class="modal-card">
  <button id="closeEditor" class="close">×</button>
  <h2>✏️ ویرایش استایل</h2>
  <input id="productId" type="hidden">
  <label>نام / متن
    <input id="editName" type="text">
  </label>
  <label>قیمت (افغانی)
    <input id="editPrice" type="number" min="0">
  </label>
  <label>دسته
    <input id="editCategory" type="text">
  </label>
  <label>توضیحات
    <textarea id="editDescription" rows="3"></textarea>
  </label>
  <label>آپلود عکس / پست
    <input id="editImage" type="file" accept="image/*">
  </label>
  <img id="preview" class="preview" alt="پیش‌نمایش">
  <button id="saveProduct" class="primary full">💾 ذخیره تغییرات</button>
 </div>
</div>

<div id="siteEditor" class="modal hidden">
 <div class="modal-card">
  <button id="closeSiteEditor" class="close">×</button>
  <h2>⚙️ تنظیمات سایت</h2>
  <label>عنوان
    <input id="siteTitleInput" type="text">
  </label>
  <label>متن زیر عنوان
    <textarea id="siteDescriptionInput" rows="3"></textarea>
  </label>
  <button id="saveSite" class="primary full">💾 ذخیره</button>
 </div>
</div>

<script src="script.js"></script>
</body>
</html>
