<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMIRY</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="hero"><div class="topbar"><div class="brand">AMIRY</div><button id="adminBtn" class="admin-btn">⚙️</button></div><div class="hero-content"><p class="eyebrow">OMID AMIRY</p><h1 id="siteTitle">AMIRY</h1><p id="siteDescription">استایل مورد علاقه‌ات را انتخاب کن.</p></div></header>
<main><section class="toolbar"><input id="search" type="search" placeholder="جستجو..."><select id="categoryFilter"><option value="all">همه</option></select></section><section id="products" class="products"></section></main>
<div id="adminPanel" class="modal hidden"><div class="modal-card"><button id="closeAdmin" class="close">×</button><h2>مدیریت</h2><label>عنوان سایت<input id="editSiteTitle"></label><label>متن زیر عنوان<textarea id="editSiteDescription" rows="2"></textarea></label><button id="saveSite" class="primary full">ذخیره</button></div></div>
<div id="productEditor" class="modal hidden"><div class="modal-card"><button id="closeEditor" class="close">×</button><h2>ویرایش</h2><input id="productId" type="hidden"><label>نام<input id="editName"></label><label>قیمت<input id="editPrice"></label><label>دسته<input id="editCategory"></label><label>توضیحات<textarea id="editDescription" rows="3"></textarea></label><label>تصویر<input id="editImage" type="file" accept="image/*"></label><div class="preview-wrap"><img id="editPreview"></div><button id="saveProduct" class="primary full">ذخیره</button></div></div>
<script src="script.js"></script></body></html>
